[profile.default]
src        = "src"
out        = "out"
libs       = ["lib"]
solc       = "0.8.24"
optimizer  = true
optimizer_runs = 200
via_ir     = false

# Show gas reports in tests
gas_reports = ["MemeVault"]

[profile.default.fuzz]
runs = 1000

[rpc_endpoints]
base         = "${BASE_RPC_URL}"
base_sepolia = "https://sepolia.base.org"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
